version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: drishti_postgres
    restart: always
    environment:
      POSTGRES_USER: drishti_user
      POSTGRES_PASSWORD: drishti_password
      POSTGRES_DB: drishti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti_user -d drishti_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drishti_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://drishti_user:drishti_password@postgres:5432/drishti_db
      SECRET_KEY: drishti_super_secret_jwt_key_sih26103_prototype_not_for_prod
      DEMO_MODE: "True"
      DATASET_LABEL: "Synthetic Demonstration Dataset"
      POLICY_DISCLAIMER: "Configurable prototype policy — not an official government threshold."
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drishti_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
